name: Build and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build with Gradle
        run: gradle build

      - name: Get mod version
        id: version
        run: echo "version=$(grep mod_version gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Find built jar
        id: jar
        run: |
          JAR=$(ls build/libs/quantum-client-*.jar | grep -v sources | head -1)
          echo "jar=$JAR" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "Quantum Client v${{ steps.version.outputs.version }}"
          body: |
            ## Quantum Client v${{ steps.version.outputs.version }}

            Fabric mod for Minecraft 1.21.4

            ### Modules
            - **Fullbright** — Maximum brightness
            - **Sprint** — Always sprint
            - **NoHurtCam** — Disable hurt camera shake
            - **NoFall** — Prevent fall damage
            - **FastPlace** — Remove block place delay
            - **AntiFireOverlay** — Hide fire overlay

            ### Install
            1. Install [Fabric Loader](https://fabricmc.net/use/installer/) for 1.21.4
            2. Download and place the `.jar` into `.minecraft/mods/`
            3. Launch Minecraft with Fabric profile
            4. Press **Right Shift** in-game to open the module menu

            Built from commit ${{ github.sha }}
          files: ${{ steps.jar.outputs.jar }}
          draft: false
          prerelease: false
